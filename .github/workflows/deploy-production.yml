name: Deploy Frontend (Production)

on:
  push:
    branches:
      - production

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 0. STRICT BRANCH RESTRICTION
      - name:  Branch Restriction Check
        if: github.ref != 'refs/heads/production'
        run: |
          echo " ERROR: Deployment is strictly allowed ONLY from the 'production' branch."
          echo "You accidentally selected: ${{ github.ref }}"
          exit 1

      # 1. Deploy Frontend
      - name: 🚀 Deploy Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo /usr/local/bin/bookqik_frontend_deploy.sh
