name: Deploy Frontend (Production)

on:
  push:
    branches: [production]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Build (production mode)
        working-directory: frontend
        run: npm run build

      - name: Deploy to Lightsail
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          REMOTE_USER: ${{ secrets.LIGHTSAIL_USER }}
          SOURCE: 'frontend/dist/'
          TARGET: '/var/www/bookqik-crm/current/'
          ARGS: '-rltgoDzvc --delete'
